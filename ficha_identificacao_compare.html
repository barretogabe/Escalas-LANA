<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Identificação - Projeto COMPARE</title>
    <style>
        :root {
            --primary: #006064;
            --secondary: #0097a7;
            --accent: #8e44ad;
            --light: #e0f7fa;
            --dark: #2c3e50;
            --bg-color: #f5f7fa;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* =========================================
           ESTILOS PARA VISUALIZAÇÃO NA TELA
           ========================================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, var(--bg-color) 0%, #e4e7eb 100%);
            padding: 30px 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 40px;
        }
        
        header {
            text-align: center;
            border-bottom: 3px solid var(--secondary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        
        .logo { font-weight: bold; font-size: 1.6rem; color: var(--primary); margin-bottom: 5px; }
        header h1 { font-size: 2rem; color: var(--dark); }
        header h2 { font-size: 1.2rem; font-weight: normal; color: #666; margin-top: 5px; }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 25px;
            background: var(--light);
            color: var(--secondary);
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            border: 1px solid var(--secondary);
        }
        .back-link:hover { background: var(--secondary); color: white; }
        
        .section-title {
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            background: var(--dark);
            padding: 8px 15px;
            border-radius: 6px;
            margin: 25px 0 15px 0;
            font-size: 14px;
        }
        
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }
        
        .field { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
        .field-expand { flex: 2; }
        .field-full { flex: 1; min-width: 100%; }
        
        label { font-weight: bold; white-space: nowrap; color: var(--primary); font-size: 14px; }
        .font-normal { font-weight: normal; color: #333; }
        
        /* Inputs Padronizados */
        input[type="text"], input[type="date"], input[type="number"], select, textarea {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            flex: 1;
            background: #fdfdfd;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--secondary); outline: none; }
        
        /* Força a largura máxima de 100% para caixas expansíveis */
        .field-expand input[type="text"], .field-full input[type="text"] {
            width: 100%;
        }

        textarea {
            width: 100%;
            resize: vertical;
        }
        
        input[type="radio"], input[type="checkbox"] { transform: scale(1.2); cursor: pointer; margin-right: 4px; }
        
        .radio-wrapper {
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .btn { padding: 12px 28px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; font-size: 14px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .btn-submit { background: var(--accent); }
        .btn-print { background: #34495e; }
        .btn-reset { background: #e74c3c; }

        .signature-area { display: none; }

        /* =========================================
           CONFIGURAÇÕES PARA IMPRESSÃO / PDF
           ========================================= */
        @media print {
            @page {
                margin: 0.5cm 0.8cm;
                size: A4 portrait;
            }
            body {
                background: white;
                color: black;
                padding: 0;
                font-size: 10.5pt !important;
                line-height: 1.6 !important; /* Espaçamento mantido em 1.6 */
            }
            .container {
                box-shadow: none;
                max-width: 100%;
                border: none;
                border-radius: 0;
                padding: 0 !important;
                margin: 0 !important;
            }
            .buttons, .back-link, .no-print, .section-title {
                display: none !important;
            }
            header {
                padding: 0 0 5px 0 !important;
                margin-bottom: 10px !important;
                border-bottom: 1px dashed black;
            }
            .logo { font-size: 11pt; margin-bottom: 0; }
            header h1 { font-size: 13pt; font-weight: bold; }
            header h2 { font-size: 10pt; margin: 0; }
            
            .row {
                margin-bottom: 5px !important;
                gap: 2px 8px !important;
                page-break-inside: avoid;
            }
            .field { gap: 2px !important; min-width: auto !important; flex: none !important; }
            .field-expand { flex-grow: 1 !important; }
            .field-full { width: 100% !important; flex: 1 1 100% !important; }
            
            .radio-wrapper {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                gap: 5px !important;
            }

            label { font-size: 10.5pt; color: black; }
            
            /* Ajustes para impressão (Substitui caixas por linhas) */
            input[type="text"], input[type="date"], input[type="number"], select, textarea {
                border: none !important;
                border-bottom: 1px solid black !important;
                border-radius: 0 !important;
                padding: 0 2px !important;
                background: transparent !important;
                font-size: 10.5pt !important;
                height: 18px !important;
                line-height: 18px !important;
                box-shadow: none !important;
                flex-grow: 1 !important;
                width: auto !important;
            }
            input[type="radio"], input[type="checkbox"] { transform: scale(1); margin-right: 2px; }
            
            textarea {
                border-bottom: 1px solid black !important;
                height: 18px !important;
                min-height: 18px !important;
                overflow: hidden !important;
                resize: none !important;
            }
            
            /* Ajuste da Assinatura no PDF */
            .signature-area {
                display: block;
                margin-top: 50px !important; /* Amplo espaço para assinatura e carimbo antes da linha */
                text-align: center;
                page-break-inside: avoid;
            }
            .signature-line {
                width: 380px;
                border-top: 1px solid black;
                margin: 0 auto;
            }
            .signature-name-print {
                margin-top: 3pt !important; /* Espaçamento exato de 3pt exigido entre a linha e o texto */
                font-weight: bold;
                font-size: 11pt;
                min-height: 20px;
            }
            
            /* Garante que elementos impressos mantenham a estrutura sem quebrar a página */
            #fisio-print-wrap {
                flex-wrap: wrap !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Laboratório de Neurociência Aplicada (LANA) - UFPE</div>
            <h1>Ficha de Identificação</h1>
            <h2>Projeto COMPARE</h2>
            <a href="index.html" class="back-link">⬅ Voltar ao Painel Inicial</a>
        </header>
        
        <form id="compareForm">
            <div class="row">
                <div class="field" style="flex: 1;">
                    <label>DATA:</label>
                    <input type="date" id="data_registro" required>
                </div>
                <div class="field" style="flex: 2;"></div> </div>
            <div class="row">
                <div class="field" style="flex: 1; min-width: 250px;">
                    <label class="font-normal"><input type="radio" name="status" value="Incluído"> INCLUÍDO, PROJETO:</label>
                    <input type="text" id="projeto_nome">
                </div>
                <div class="field" style="flex: 0.5; min-width: 180px;">
                    <label>IDENTIFICAÇÃO Nº:</label>
                    <input type="text" id="id_numero">
                </div>
            </div>
            <div class="row">
                <div class="field field-full">
                    <label class="font-normal"><input type="radio" name="status" value="Excluído"> EXCLUÍDO, MOTIVO:</label>
                    <input type="text" id="motivo_exclusao">
                </div>
            </div>

            <div class="section-title">Dados Pessoais</div>
            <div class="row">
                <div class="field field-full">
                    <label>Nome:</label>
                    <input type="text" id="nome_paciente" required>
                </div>
            </div>
            
            <div class="row" style="flex-wrap: wrap;">
                <div class="field" style="flex: 1 1 auto; white-space: nowrap;">
                    <label>Data de Nasc.:</label>
                    <input type="date" id="data_nasc" onchange="calcularIdade()" style="width: 130px; flex: none;">
                </div>
                <div class="field" style="flex: 1 1 auto; white-space: nowrap;">
                    <label>Idade:</label>
                    <input type="number" id="idade" readonly style="width: 60px; flex: none; background: #eee; cursor: not-allowed;">
                </div>
                <div class="field radio-wrapper" style="flex: 1 1 auto; white-space: nowrap; padding: 6px 12px; justify-content: center;">
                    <label>Sexo:</label>
                    <label class="font-normal"><input type="radio" name="sexo" value="M"> M</label>
                    <label class="font-normal" style="margin-left: 10px;"><input type="radio" name="sexo" value="F"> F</label>
                </div>
                <div class="field" style="flex: 1 1 auto; white-space: nowrap;">
                    <label>Peso (kg):</label>
                    <input type="text" id="peso" style="width: 70px; flex: none;">
                </div>
                <div class="field" style="flex: 1 1 auto; white-space: nowrap;">
                    <label>Altura (m):</label>
                    <input type="text" id="altura" style="width: 70px; flex: none;">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-expand">
                    <label>Est. Civil:</label>
                    <input type="text" id="estado_civil">
                </div>
                <div class="field field-expand" style="flex: 2;">
                    <label>Bairro/Cidade:</label>
                    <input type="text" id="endereco">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-expand">
                    <label>Telefones:</label>
                    <input type="text" id="telefones">
                </div>
                <div class="field field-expand">
                    <label>Nacionalidade:</label>
                    <input type="text" id="nacionalidade" value="Brasileira">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-expand">
                    <label>Escolaridade:</label>
                    <input type="text" id="escolaridade">
                </div>
                <div class="field field-expand">
                    <label>Profissão:</label>
                    <input type="text" id="profissao">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>Responsáveis/Contatos para emergência:</label>
                    <input type="text" id="contato_emergencia">
                </div>
            </div>

            <div class="section-title">Dados Terapêuticos</div>
            <div class="row">
                <div class="field field-full">
                    <label>Acompanhamento médico:</label>
                    <input type="text" id="acomp_medico">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>Encaminhamento:</label>
                    <label class="font-normal"><input type="radio" name="encaminhamento" value="Não"> NÃO;</label>
                    <label class="font-normal" style="margin-left: 10px;"><input type="radio" name="encaminhamento" value="Sim"> SIM, quem?</label>
                    <input type="text" id="encaminhamento_quem" style="margin-left: 5px;">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-expand">
                    <label>Diagnóstico clínico:</label>
                    <input type="text" id="diag_clinico">
                </div>
                <div class="field field-expand">
                    <label>Tempo de diagnóstico clínico (meses):</label>
                    <input type="text" id="tempo_diag">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>HDA:</label>
                    <textarea id="historico_doenca" rows="1"></textarea>
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>Exame de imagem/achados relevantes:</label>
                    <textarea id="exames_imagem" rows="1"></textarea>
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full" id="fisio-print-wrap" style="flex-wrap: wrap; gap: 10px;">
                    <label>Realiza fisioterapia:</label>
                    <label class="font-normal"><input type="radio" name="fisio" value="Sim"> SIM, quantas vezes:</label>
                    <input type="text" id="fisio_freq" style="flex: 0.5; min-width: 60px;">
                    <label class="font-normal">há quanto tempo:</label>
                    <input type="text" id="fisio_tempo" style="flex: 0.8; min-width: 80px;">
                    
                    <label class="font-normal" style="margin-left: 10px;"><input type="radio" name="fisio" value="Não"> NÃO;</label>
                    <label class="font-normal" style="margin-left: 10px;"><input type="radio" name="fisio" value="Já fez"> JÁ FEZ, há quanto tempo:</label>
                    <input type="text" id="fisio_tempo_ja_fez" style="flex: 1; min-width: 100px;">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>Medicamentos (quais e horários):</label>
                    <input type="text" id="medicamentos">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>Comorbidades:</label>
                    <label class="font-normal"><input type="checkbox" name="comorbidades" value="HAS"> HAS;</label>
                    <label class="font-normal" style="margin-left: 8px;"><input type="checkbox" name="comorbidades" value="Diabetes"> DIABETES;</label>
                    <label class="font-normal" style="margin-left: 8px;"><input type="checkbox" name="comorbidades" value="Labirintite"> LABIRINTITE;</label>
                    <label class="font-normal" style="margin-left: 8px;"><input type="checkbox" name="comorbidades" value="Outras"> OUTRA (S):</label>
                    <input type="text" id="comorbidades_outras" style="margin-left: 5px;">
                </div>
            </div>
            
            <div class="row">
                <div class="field field-full">
                    <label>Já foi submetido a alguma técnica de estimulação cerebral não invasiva?</label>
                    <label class="font-normal"><input type="radio" name="estimulacao" value="Não"> NÃO;</label>
                    <label class="font-normal" style="margin-left: 10px;"><input type="radio" name="estimulacao" value="Sim"> SIM, qual e há quanto tempo:</label>
                    <input type="text" id="estimulacao_qual">
                </div>
            </div>
            
            <div class="row no-print" style="margin-top: 25px; background: #e0f7fa; padding: 15px; border-radius: 8px; justify-content: center;">
                <div class="field" style="flex: none;">
                    <label>Profissional Responsável (Aparecerá no PDF):</label>
                    <input type="text" id="profissional_resp" value="" placeholder="Digite o nome do avaliador" style="width: 280px; text-align: center; font-weight: bold;">
                </div>
            </div>

            <div class="signature-area">
                <div class="signature-line"></div>
                <div id="print_nome_profissional" class="signature-name-print"></div>
                <div style="font-size: 0.85rem; color: #555; text-transform: uppercase;">PROFISSIONAL RESPONSÁVEL - Assinatura e carimbo</div>
            </div>
        </form>

        <div class="buttons">
            <button class="btn btn-submit" onclick="sendToSheets()">☁️ Salvar na Planilha</button>
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
            <button class="btn btn-reset" onclick="resetForm()">🔄 Limpar</button>
        </div>
    </div>

    <script>
        document.getElementById('data_registro').valueAsDate = new Date();

        // Vincula dinamicamente a caixa de edição ao texto da assinatura no PDF
        document.getElementById('profissional_resp').addEventListener('input', function(e) {
            document.getElementById('print_nome_profissional').textContent = e.target.value;
        });

        function toggleStatus() {
            const status = document.querySelector('input[name="status"]:checked')?.value;
            document.getElementById('box_incluido').style.display = status === 'Incluído' ? 'grid' : 'none';
            document.getElementById('box_excluido').style.display = status === 'Excluído' ? 'block' : 'none';
        }

        function calcularIdade() {
            const nasc = new Date(document.getElementById('data_nasc').value);
            const hoje = new Date();
            let idade = hoje.getFullYear() - nasc.getFullYear();
            const m = hoje.getMonth() - nasc.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
            document.getElementById('idade').value = isNaN(idade) ? '' : idade;
        }

        const EXPORT_FIELDS = [
            { id: 'data_registro', label: 'Data' },
            { name: 'status', label: 'Situação', isRadio: true },
            { id: 'projeto_nome', label: 'Projeto' },
            { id: 'id_numero', label: 'Nº Identificação' },
            { id: 'motivo_exclusao', label: 'Motivo Exclusão' },
            { id: 'nome_paciente', label: 'Nome' },
            { id: 'data_nasc', label: 'Data Nasc.' },
            { id: 'idade', label: 'Idade' },
            { name: 'sexo', label: 'Sexo', isRadio: true },
            { id: 'peso', label: 'Peso' },
            { id: 'altura', label: 'Altura' },
            { id: 'estado_civil', label: 'Est. Civil' },
            { id: 'endereco', label: 'Endereço/Cidade' },
            { id: 'telefones', label: 'Telefones' },
            { id: 'nacionalidade', label: 'Nacionalidade' },
            { id: 'escolaridade', label: 'Escolaridade' },
            { id: 'profissao', label: 'Profissão' },
            { id: 'contato_emergencia', label: 'Emergência' },
            { id: 'acomp_medico', label: 'Acomp. Médico' },
            { name: 'encaminhamento', label: 'Teve Encaminhamento?', isRadio: true },
            { id: 'encaminhamento_quem', label: 'Encaminhado por' },
            { id: 'diag_clinico', label: 'Diag. Clínico' },
            { id: 'tempo_diag', label: 'Tempo Diag. (meses)' },
            { id: 'historico_doenca', label: 'HDA' },
            { id: 'exames_imagem', label: 'Exames Imagem' },
            { name: 'fisio', label: 'Faz Fisio?', isRadio: true },
            { id: 'fisio_freq', label: 'Freq. Fisio' },
            { id: 'fisio_tempo', label: 'Tempo Fisio' },
            { id: 'fisio_tempo_ja_fez', label: 'Tempo Fisio Antigo' },
            { id: 'medicamentos', label: 'Medicamentos' },
            { name: 'comorbidades', label: 'Comorbidades', isCheckbox: true },
            { id: 'comorbidades_outras', label: 'Outras Comorb.' },
            { name: 'estimulacao', label: 'Estimulação Cerebral?', isRadio: true },
            { id: 'estimulacao_qual', label: 'Detalhes Estimulação' },
            { id: 'profissional_resp', label: 'Profissional' }
        ];

        function getFieldValue(field) {
            if (field.isRadio) {
                const checked = document.querySelector(`input[name="${field.name}"]:checked`);
                return checked ? checked.value : '';
            }
            if (field.isCheckbox) {
                const checked = document.querySelectorAll(`input[name="${field.name}"]:checked`);
                return Array.from(checked).map(cb => cb.value).join(', ');
            }
            const el = document.getElementById(field.id);
            return el ? el.value : '';
        }

        function buildPayload() {
            const data = {};
            EXPORT_FIELDS.forEach(f => { data[f.label] = getFieldValue(f); });
            return data;
        }

        function sendToSheets() {
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '⏳ Enviando...';
            
            const payloadData = buildPayload();
            const payload = {
                escala: "Ficha_COMPARE",
                headers: Object.keys(payloadData),
                values: Object.values(payloadData)
            };

            const url = "https://script.google.com/macros/s/AKfycbzdAWqTlJqKJxOXduKZ2fpkoueWiZOdbDYwpdygvViKiHlJ_O6HCQEOnFA_62XAdtU4HA/exec"; 

            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('✅ Dados enviados para a planilha!');
                btn.innerHTML = originalText;
            }).catch(() => {
                alert('❌ Erro de conexão.');
                btn.innerHTML = originalText;
            });
        }

        function resetForm() {
            if(confirm('Limpar todos os campos?')) {
                document.getElementById('compareForm').reset();
                document.getElementById('data_registro').valueAsDate = new Date();
                document.getElementById('idade').value = '';
                document.getElementById('print_nome_profissional').textContent = '';
            }
        }
    </script>
</body>
</html>
